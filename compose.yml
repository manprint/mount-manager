name: rclone-stack-superdufs

services:

  rclone-mount:
    image: rclone/rclone:latest
    container_name: rclone-mount
    hostname: rclone-mount.noc
    pull_policy: always
    restart: no
    tty: true
    stdin_open: true
    network_mode: bridge
    user: 1000:1000
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./config:/config:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/group:/etc/group:ro
      - /etc/passwd:/etc/passwd:ro
      - ./mymount:/mnt/mount:rshared
    environment:
      - TZ=Europe/Rome
    logging:
      options:
        max-size: "10m"
    stop_grace_period: 30s
    command:
      - --config=/config/rclone.conf
      - mount
      - remote:/
      - /mnt/mount
      - -v
      - --stats=5s
      - --stats-one-line
      - --uid=1000
      - --gid=1000
      - --umask=0002
      - --file-perms=0777
      - --dir-perms=0777
      - --size-only
      - --allow-non-empty
      - --allow-other
      - --cache-dir=/tmp/rclone
      - --dir-cache-time=30s
      - --poll-interval=0
      - --no-checksum
      - --size-only
      - --vfs-fast-fingerprint
      - --vfs-cache-mode=full
      - --vfs-cache-max-size=3G
      - --vfs-cache-max-age=3h
      - --vfs-read-chunk-size=16M
      - --vfs-read-chunk-size-limit=128M
      - --vfs-cache-poll-interval=60s
      - --buffer-size=8M
      - --transfers=2
      - --checkers=2

  superdufs:
    image: fabiop85/superdufs:v1.5.0
    pull_policy: always
    container_name: superdufs
    restart: always
    user: "${DUFS_UID:-1000}:${DUFS_GID:-1000}"
    ports:
      - "5000:5000"
    volumes:
      - ./mymount:/data
    command: >-
      /data
      -A
      -a admin:pass@/:rw
      --show-concurrent-uploads-settings
      --publink-enabled
      --resilient-player-max-retry=30
      --resilient-player-reconnect-interval=15
